[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "email-sender"
version = "0.1.0"
description = "Autonomous lead outreach automation for web development client acquisition"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Andrei", email = "gracefulandrei@gmail.com"},
]
license = {text = "MIT"}
keywords = [
    "lead-generation",
    "cold-email",
    "smtp",
    "automation",
    "web-development",
    "small-business",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Small Business",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.1.0",
    "bandit>=1.7.0",
]

[project.scripts]
email-sender = "src.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "I", "N", "S", "W"]
ignore = ["E501", "S105", "S106", "S107", "S307", "S310", "S603", "S607", "S608"]

[tool.ruff.isort]
known-first-party = ["src"]
